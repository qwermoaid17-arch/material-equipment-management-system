<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Cairo',sans-serif;background:linear-gradient(135deg,#1f3a5f,#2e6da4);min-height:100vh}</style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-lg border-0" style="max-width:400px;width:100%">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="display-5">📦</div>
        <h4 class="fw-bold mt-2">نظام إدارة المواد والمعدات</h4>
        <p class="text-muted small mb-0">سجل الدخول للمتابعة</p>
      </div>
      {% if form.errors %}<div class="alert alert-danger py-2">اسم المستخدم أو كلمة المرور غير صحيحة</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3"><label class="form-label">اسم المستخدم</label>
          <input name="username" class="form-control" autofocus required></div>
        <div class="mb-3"><label class="form-label">كلمة المرور</label>
          <input name="password" type="password" class="form-control" required></div>
        <button class="btn btn-primary w-100">دخول</button>
      </form>
    </div>
  </div>
</body>
</html>
